name: Publish Staging Image

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-staging
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set staging version
        id: version
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "value=staging-${COMMIT_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish frontend staging architecture
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_TNLASTATION_VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: |
            ghcr.io/miutaku/tnlastation-frontend:staging-${{ matrix.arch }}
            ghcr.io/miutaku/tnlastation-frontend:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}

  publish:
    name: Publish multi-architecture manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set staging version
        id: version
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "value=staging-${COMMIT_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish frontend manifests
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/miutaku/tnlastation-frontend:staging \
            ghcr.io/miutaku/tnlastation-frontend:staging-amd64 \
            ghcr.io/miutaku/tnlastation-frontend:staging-arm64
          docker buildx imagetools create \
            --tag "ghcr.io/miutaku/tnlastation-frontend:$VERSION" \
            "ghcr.io/miutaku/tnlastation-frontend:$VERSION-amd64" \
            "ghcr.io/miutaku/tnlastation-frontend:$VERSION-arm64"
